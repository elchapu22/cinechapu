# fly.toml app configuration file generated for cinechapu-app on 2026-09-26T09:17:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cinechapu-app'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'cinechapu_app'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
